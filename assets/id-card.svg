<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#04120a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#ff0080"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .flicker { animation: flicker 3.4s infinite; }
      .scan { animation: scan 4s linear infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .blink { animation: blink 1.4s steps(1) infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes flicker {
        0%, 92%, 100% { opacity: 1; }
        93%, 95% { opacity: 0.55; }
      }
      @keyframes scan {
        0% { transform: translateY(-130px); opacity: 0; }
        10% { opacity: 0.5; }
        90% { opacity: 0.5; }
        100% { transform: translateY(130px); opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- outer glowing border -->
  <rect x="4" y="4" width="752" height="252" rx="18" fill="none" stroke="url(#borderGlow)" stroke-width="2.5" filter="url(#glow)" class="pulse"/>
  <!-- card body -->
  <rect x="8" y="8" width="744" height="244" rx="16" fill="url(#bg)"/>

  <!-- scanning light sweep, clipped to card -->
  <clipPath id="cardClip">
    <rect x="8" y="8" width="744" height="244" rx="16"/>
  </clipPath>
  <g clip-path="url(#cardClip)">
    <rect x="8" y="0" width="744" height="60" fill="#00ff41" opacity="0.06" class="scan"/>
  </g>

  <!-- header strip -->
  <rect x="8" y="8" width="744" height="34" rx="16" fill="#00ff4111"/>
  <text x="30" y="30" class="mono" font-size="14" fill="#00ff41" letter-spacing="2">DEVELOPER ID · LIMO-25</text>
  <circle cx="705" cy="25" r="5" fill="#00ff41" class="blink"/>
  <text x="716" y="29" class="mono" font-size="11" fill="#7dffb0">LIVE</text>

  <!-- avatar ring -->
  <g class="float">
    <circle cx="110" cy="150" r="62" fill="none" stroke="url(#ring)" stroke-width="3"/>
    <circle cx="110" cy="150" r="50" fill="#0d1117" stroke="#00d9ff55" stroke-width="1"/>
    <text x="110" y="160" class="mono" font-size="34" fill="#00ff41" text-anchor="middle" filter="url(#glow)">A</text>
  </g>

  <!-- vertical divider -->
  <line x1="205" y1="55" x2="205" y2="235" stroke="#00ff4133" stroke-width="1"/>

  <!-- identity block -->
  <text x="230" y="80" class="mono flicker" font-size="24" fill="#ffffff" font-weight="bold">ARIJIT DAS</text>
  <text x="230" y="104" class="mono" font-size="13" fill="#00d9ff">B.Tech CSE (AI/ML) · Brainware University</text>

  <text x="230" y="136" class="mono" font-size="12" fill="#7dffb0">📍 West Bengal, India</text>
  <text x="230" y="158" class="mono" font-size="12" fill="#7dffb0">🎯 DSA in Java · Backend-first Full Stack</text>
  <text x="230" y="180" class="mono" font-size="12" fill="#7dffb0">🧠 3rd Year · Placement Track</text>
  <text x="230" y="202" class="mono" font-size="12" fill="#ff80c0">⚡ Fun fact: debugs faster than it sleeps</text>

  <!-- barcode footer -->
  <g transform="translate(230,215)">
    <rect x="0" y="0" width="2" height="18" fill="#00ff41"/>
    <rect x="4" y="0" width="1" height="18" fill="#00ff41"/>
    <rect x="7" y="0" width="3" height="18" fill="#00ff41"/>
    <rect x="12" y="0" width="1" height="18" fill="#00ff41"/>
    <rect x="15" y="0" width="2" height="18" fill="#00ff41"/>
    <rect x="19" y="0" width="1" height="18" fill="#00ff41"/>
    <rect x="22" y="0" width="4" height="18" fill="#00ff41"/>
    <rect x="28" y="0" width="1" height="18" fill="#00ff41"/>
    <rect x="31" y="0" width="2" height="18" fill="#00ff41"/>
    <rect x="35" y="0" width="1" height="18" fill="#00ff41"/>
    <rect x="38" y="0" width="3" height="18" fill="#00ff41"/>
    <text x="55" y="13" class="mono" font-size="10" fill="#4a5568">LIMO-25 · DEV-2026 · ROOT ACCESS</text>
  </g>

  <text x="732" y="248" class="mono" font-size="9" fill="#2d3748" text-anchor="end">SYS://ONLINE</text>
</svg>
